[build-system]
requires = ["setuptools >= 68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "digimuh"
version = "1.0.1"
description = "DigiMuh — dairy cow sensor data ingestion and analysis toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bart R. H. Geurten", email = "bart.geurten@otago.ac.nz"},
]
keywords = [
    "dairy", "cattle", "sensor", "sqlite", "precision-livestock",
    "animal-science", "smaxtec", "herdeplus",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
analysis = [
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "rerandomstats >= 0.2.0",
    "plotly",
    "kaleido",
    "openpyxl",
    "pyyaml",
    "rich",
    "tqdm",
]
dev = [
    "pytest >= 7.0",
    "pytest-cov >= 4.0",
    "sphinx >= 7.0",
    "sphinx-rtd-theme",
    "tqdm",
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "rerandomstats >= 0.2.0",
    "ruff >= 0.4",
    # Runtime deps the analysis path actually uses.  Without these the test
    # run silently exercises import-error fallbacks instead of the code a
    # user runs — console output goes to logging rather than rich, and the
    # config loader and spreadsheet reader are never touched at all.
    "rich",
    "pyyaml",
    "openpyxl",
]
progress = [
    "tqdm",
]

[project.scripts]
digimuh-ingest    = "digimuh.ingest:main"
digimuh-extract   = "digimuh.extract:main"
digimuh-stats     = "digimuh.stats_runner:main"
digimuh-model-comparison = "digimuh.stats_model_comparison:main"
digimuh-plots     = "digimuh.viz_runner:main"
digimuh-frontiers = "digimuh.run_frontiers_2026:main"
digimuh-annual    = "digimuh.run_annual_yield:main"
digimuh-config = "digimuh.config:main"
digimuh-ketosis = "digimuh.analysis_01_ketosis:main"
digimuh-heat = "digimuh.analysis_03_heat_stress:main"
digimuh-digestive = "digimuh.analysis_06_digestive:main"
digimuh-circadian = "digimuh.analysis_11_circadian:main"
digimuh-entropy = "digimuh.analysis_12_motility_entropy:main"
digimuh-validate = "digimuh.validate_db:main"
digimuh-milk-yield = "digimuh.milk_yield_classification:main"

[project.urls]
Repository = "https://github.com/zerotonin/digimuh"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
# _legacy/ is preserved reference code (pre-refactor pipeline); not linted.
extend-exclude = ["src/digimuh/_legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E712 (== True / == False) is the NaN-safe idiom for pandas boolean masks
# here: convergence flags (e.g. hill_*_converged) may be NaN or absent, and
# `df[df[col] == True]` drops NaN rows whereas bare `df[df[col]]` raises
# "Cannot mask with non-boolean array containing NA".  Kept intentionally.
ignore = ["E712"]
